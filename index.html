<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QRIS Dinamis - Premium</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* Glassmorphism Light & Dark (Aesthetic Obsidian) */
        .glass-panel-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
        }
        .dark .glass-panel-light {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }

        /* Animations */
        .scale-in {
            animation: scaleIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.35s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* iOS Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #6366f1;
        }
        .toggle-checkbox:checked + .toggle-label {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }

        /* Checkmark Animation */
        .checkmark-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 2;
            stroke: #4ade80;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #4ade80;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #4ade80;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 30px rgba(74, 222, 128, 0.1); } }
    </style>
</head>
<body id="bodyRoot" class="min-h-screen bg-[#f4f6fb] dark:bg-[#070b14] flex items-center justify-center p-4 transition-colors duration-300 relative overflow-x-hidden select-none">

    <!-- Ambient Glow Background -->
    <div class="fixed top-[-10%] left-[-10%] w-80 h-80 bg-blue-400 dark:bg-indigo-600/30 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[120px] opacity-30 dark:opacity-40 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-80 h-80 bg-purple-400 dark:bg-blue-600/25 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[120px] opacity-30 dark:opacity-40 pointer-events-none"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden items-center gap-2.5 bg-slate-900/95 dark:bg-slate-800/95 text-white px-4 py-3 rounded-2xl shadow-xl border border-white/10 backdrop-blur-md text-sm font-medium transition-all duration-300 opacity-0 translate-y-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toastText">QRIS berhasil disimpan!</span>
    </div>

    <!-- Theme Switcher (Top Right) -->
    <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-20 flex items-center gap-2 bg-white/70 dark:bg-slate-900/70 px-3 py-1.5 rounded-full backdrop-blur-md border border-slate-200/80 dark:border-white/10 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <div class="relative inline-block w-11 align-middle select-none transition duration-200 ease-in">
            <input type="checkbox" name="toggle" id="themeToggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-2 appearance-none cursor-pointer border-slate-300 dark:border-indigo-400 transition-all duration-300 left-0.5 top-0.5 checked:right-0.5 checked:left-auto shadow-sm"/>
            <label for="themeToggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-200 dark:bg-slate-800 cursor-pointer transition-colors duration-300"></label>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-500 dark:text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </div>

    <main id="mainPanel" class="glass-panel-light w-full max-w-md p-6 sm:p-7 rounded-[2rem] relative z-10 fade-in transition-all duration-300 mt-8 sm:mt-0">
        
        <!-- Header -->
        <div class="text-center mb-5">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-500/10 dark:bg-indigo-500/15 border border-blue-500/20 dark:border-indigo-400/20 text-blue-600 dark:text-indigo-300 text-[11px] font-semibold tracking-wider uppercase mb-2">
                QRIS Dinamis
            </div>
            <h1 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">
                ARIF DHARMA , DIGITAL & KREATIF
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-xs mt-0.5 font-medium">NMID: ID1025428566216</p>
        </div>

        <!-- Input Section -->
        <div id="inputSection" class="flex flex-col gap-5">
            
            <!-- Error Alert -->
            <div id="errorMessage" class="hidden bg-red-500/10 dark:bg-red-500/15 border border-red-500/30 text-red-600 dark:text-red-300 px-4 py-3 rounded-2xl text-xs font-medium backdrop-blur-sm">
                <span id="errorText"></span>
            </div>

            <!-- Nominal Display Box (Separated clearly) -->
            <div class="p-4 rounded-2xl bg-slate-100/90 dark:bg-[#0b1120]/90 border border-slate-200/90 dark:border-indigo-500/25 shadow-inner flex flex-col gap-1 transition-colors">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Nominal Pembayaran</label>
                    <button type="button" id="clearBtn" class="text-xs font-medium text-slate-400 hover:text-red-500 dark:text-slate-500 dark:hover:text-red-400 transition-colors px-1.5 py-0.5 rounded-md">
                        Hapus Semua
                    </button>
                </div>
                <div class="text-right pt-1">
                    <span id="nominalDisplay" class="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white tracking-tight">Rp 0</span>
                </div>
            </div>

            <!-- Separator -->
            <div class="h-px w-full bg-gradient-to-r from-transparent via-slate-200 dark:via-white/10 to-transparent"></div>

            <!-- iOS Numeric Keypad (0 on left, 000 in middle) -->
            <div class="grid grid-cols-3 gap-2.5">
                <button type="button" data-key="1" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">1</button>
                <button type="button" data-key="2" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">2</button>
                <button type="button" data-key="3" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">3</button>
                
                <button type="button" data-key="4" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">4</button>
                <button type="button" data-key="5" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">5</button>
                <button type="button" data-key="6" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">6</button>
                
                <button type="button" data-key="7" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">7</button>
                <button type="button" data-key="8" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">8</button>
                <button type="button" data-key="9" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">9</button>
                
                <!-- Row 4: 0 on left, 000 in middle, Delete on right -->
                <button type="button" data-key="0" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-xl">0</button>
                <button type="button" data-key="000" class="numpad-btn bg-white hover:bg-slate-50 dark:bg-white/[0.06] dark:hover:bg-white/[0.12] border border-slate-200/70 dark:border-white/[0.06] text-slate-800 dark:text-slate-100 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 text-lg">000</button>
                <button type="button" data-key="del" aria-label="Hapus digit" class="numpad-btn bg-red-500/10 hover:bg-red-500/20 dark:bg-rose-500/15 dark:hover:bg-rose-500/25 border border-red-500/15 dark:border-rose-500/20 text-red-600 dark:text-rose-400 font-semibold py-3.5 rounded-2xl shadow-sm transition-all active:scale-95 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                    </svg>
                </button>
            </div>

            <!-- Primary Action Button -->
            <button type="button" id="generateBtn" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 dark:from-indigo-600 dark:to-blue-600 dark:hover:from-indigo-500 dark:hover:to-blue-500 text-white font-semibold py-4 rounded-2xl shadow-lg shadow-blue-600/25 dark:shadow-indigo-600/30 transition-all transform active:scale-[0.98] text-base">
                Buat QRIS Dinamis
            </button>
        </div>

        <!-- Result Section (Hidden by default) -->
        <div id="resultSection" class="hidden flex-col items-center">
            
            <!-- Top Bar inside Result: Nominal + Download Button -->
            <div class="w-full flex items-center justify-between bg-slate-100/80 dark:bg-white/[0.04] border border-slate-200/80 dark:border-white/[0.08] px-4 py-3 rounded-2xl mb-5">
                <div>
                    <p class="text-slate-500 dark:text-slate-400 text-[11px] font-medium">Total Tagihan</p>
                    <div class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight" id="displayNominal">Rp 0</div>
                </div>
                <button type="button" id="saveBtn" class="inline-flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 dark:bg-indigo-500/20 dark:hover:bg-indigo-500/30 dark:border dark:border-indigo-400/30 text-white dark:text-indigo-200 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all active:scale-95 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>Simpan QR</span>
                </button>
            </div>
            
            <!-- QR Card Container (Always crisp white background for reliable scanning in dark mode) -->
            <div class="bg-white p-5 rounded-3xl shadow-xl dark:shadow-[0_15px_40px_rgba(0,0,0,0.6)] mb-6 relative scale-in border border-slate-200/90 dark:border-white/20 flex flex-col items-center">
                <div class="text-[11px] font-bold tracking-widest text-slate-400 uppercase mb-3">SCAN QRIS</div>
                <div id="qrcode" class="flex items-center justify-center"></div>
                <div class="mt-3 text-[11px] font-medium text-slate-500">SATU QRIS UNTUK SEMUA</div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 w-full fade-in">
                <button type="button" id="resetBtn" class="flex-1 py-3.5 rounded-2xl font-medium border border-slate-300 dark:border-white/10 hover:bg-slate-100 dark:hover:bg-white/[0.06] transition-colors text-slate-600 dark:text-slate-300 text-sm">
                    Transaksi Baru
                </button>
                <button type="button" id="paidBtn" class="flex-1 py-3.5 rounded-2xl font-semibold bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white shadow-lg shadow-emerald-500/25 transition-all transform active:scale-95 text-sm">
                    Sudah Dibayar
                </button>
            </div>
        </div>

        <!-- Success Overlay -->
        <div id="successOverlay" class="absolute inset-0 z-50 glass-panel-light rounded-[2rem] hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
            <svg class="checkmark-wrapper" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
            <p class="text-slate-800 dark:text-white mt-6 text-xl font-semibold tracking-wide fade-in" style="animation-delay: 0.4s;">Transaksi Berhasil</p>
            <p class="text-slate-500 dark:text-slate-400 text-xs mt-1">Pembayaran telah diterima</p>
        </div>

    </main>

<script>
    // ==========================================
    // STRING QRIS STATIS ANDA DI SINI
    // ==========================================
    const STATIC_QRIS = '00020101021126610014COM.GO-JEK.WWW01189360091438351492230210G8351492230303UMI51440014ID.CO.QRIS.WWW0215ID10254285662160303UMI5204899953033605802ID5925ARIF DHARMA , Digital & K6008PONOROGO61056341862070703A016304333A';

    // State Nominal
    let currentRawValue = "";
    let toastTimeout = null;

    // Referensi DOM
    const bodyRoot = document.getElementById('bodyRoot');
    const themeToggle = document.getElementById('themeToggle');
    const inputSection = document.getElementById('inputSection');
    const resultSection = document.getElementById('resultSection');
    const nominalDisplay = document.getElementById('nominalDisplay');
    const generateBtn = document.getElementById('generateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resetBtn = document.getElementById('resetBtn');
    const paidBtn = document.getElementById('paidBtn');
    const saveBtn = document.getElementById('saveBtn');
    const qrcodeDiv = document.getElementById('qrcode');
    const displayNominal = document.getElementById('displayNominal');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successOverlay = document.getElementById('successOverlay');
    const numpadBtns = document.querySelectorAll('.numpad-btn');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    let qrcode = null;

    // Toast Helper
    function showToast(message) {
        toastText.innerText = message;
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        void toast.offsetWidth;
        toast.classList.remove('opacity-0', 'translate-y-4');
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 300);
        }, 2800);
    }

    // Default Light Mode Setup
    if (localStorage.getItem('theme') === 'dark') {
        bodyRoot.classList.add('dark');
        themeToggle.checked = true;
    } else {
        bodyRoot.classList.remove('dark');
        themeToggle.checked = false;
    }

    // Toggle Theme Event
    themeToggle.addEventListener('change', () => {
        if (themeToggle.checked) {
            bodyRoot.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        } else {
            bodyRoot.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        }
    });

    // Fungsi Format Rupiah
    function formatRupiah(angka) {
        if (!angka || angka === "") return "Rp 0";
        let numberString = angka.replace(/[^,\d]/g, "").toString();
        let split = numberString.split(",");
        let sisa = split[0].length % 3;
        let rupiah = split[0].substr(0, sisa);
        let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

        if (ribuan) {
            let separator = sisa ? "." : "";
            rupiah += separator + ribuan.join(".");
        }
        rupiah = split[1] != undefined ? rupiah + "," + split[1] : rupiah;
        return "Rp " + rupiah;
    }

    // Keypad Logic
    numpadBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            hideError();
            const key = btn.getAttribute('data-key');
            
            if (key === 'del') {
                currentRawValue = currentRawValue.slice(0, -1);
            } else {
                if (currentRawValue === "" && (key === "0" || key === "000")) {
                    return;
                }
                if (currentRawValue.length < 10) {
                    currentRawValue += key;
                }
            }

            nominalDisplay.innerText = formatRupiah(currentRawValue);
        });
    });

    // Clear Button
    clearBtn.addEventListener('click', () => {
        currentRawValue = "";
        nominalDisplay.innerText = "Rp 0";
        hideError();
    });

    // Fungsi Kalkulasi CRC16-CCITT (0xFFFF, polinomial 0x1021)
    function crc16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
            crc ^= str.charCodeAt(c) << 8;
            for (let i = 0; i < 8; i++) {
                if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                else crc = crc << 1;
            }
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    // Fungsi Error UI
    function showError(msg) {
        errorText.innerText = msg;
        errorMessage.classList.remove('hidden');
        errorMessage.classList.add('fade-in');
    }

    function hideError() {
        errorMessage.classList.add('hidden');
    }

    // Generate QRIS Dinamis
    generateBtn.addEventListener('click', () => {
        hideError();
        const amount = parseInt(currentRawValue, 10);

        if (!amount || isNaN(amount) || amount <= 0) {
            showError("Silakan masukkan nominal pembayaran terlebih dahulu.");
            return;
        }

        try {
            // Ubah statis (010211) menjadi dinamis (010212)
            let qris = STATIC_QRIS.replace("010211", "010212");
            let nominalStr = amount.toString();
            // Buat tag 54: "54" + panjang string nominal (2 digit) + nominal
            let nominalTag = "54" + nominalStr.length.toString().padStart(2, '0') + nominalStr;
            
            // Buang CRC lama (4 karakter terakhir)
            qris = qris.slice(0, -4); 
            
            let index6304 = qris.lastIndexOf("6304");
            if (index6304 === -1) {
                showError("Format QRIS tidak valid. Tag '6304' tidak ditemukan.");
                return;
            }

            // Sisipkan tag nominal sebelum tag 6304
            let newQris = qris.substring(0, index6304) + nominalTag + qris.substring(index6304);
            // Hitung ulang CRC
            let finalCrc = crc16(newQris);
            let finalQris = newQris + finalCrc;

            // Update UI
            displayNominal.innerText = formatRupiah(amount.toString());
            qrcodeDiv.innerHTML = "";
            
            // Render QR Code baru dengan resolusi tajam
            qrcode = new QRCode(qrcodeDiv, {
                text: finalQris,
                width: 240,
                height: 240,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });

            // Transisi UI
            inputSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            resultSection.classList.add('flex');

        } catch (e) {
            showError("Terjadi kesalahan memproses QRIS.");
            console.error(e);
        }
    });

    // Reset (Transaksi Baru)
    resetBtn.addEventListener('click', resetApp);

    function resetApp() {
        resultSection.classList.add('hidden');
        resultSection.classList.remove('flex');
        inputSection.classList.remove('hidden');
        currentRawValue = "";
        nominalDisplay.innerText = "Rp 0";
        hideError();
        successOverlay.classList.add('hidden');
        successOverlay.classList.remove('flex');
        successOverlay.style.opacity = '0';
    }

    // Simpan QR sebagai Gambar (Pure High-Res HTML5 Canvas Renderer)
    saveBtn.addEventListener('click', () => {
        const qrCanvas = document.querySelector('#qrcode canvas');
        const qrImg = document.querySelector('#qrcode img');
        const sourceElement = qrCanvas || qrImg;

        if (!sourceElement) {
            showError("QR Code belum tersedia untuk disimpan.");
            return;
        }

        try {
            // Buat canvas komposit beresolusi tinggi (600x780) agar rapi & mudah dipindai
            const exportCanvas = document.createElement('canvas');
            const ctx = exportCanvas.getContext('2d');
            exportCanvas.width = 600;
            exportCanvas.height = 780;

            // Latar putih bersih
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            // Header aksen atas
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 24px Poppins, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ARIF DHARMA , DIGITAL & KREATIF', 300, 75);

            // NMID
            ctx.fillStyle = '#64748b';
            ctx.font = '500 18px Poppins, sans-serif';
            ctx.fillText('NMID: ID1025428566216', 300, 108);

            // Nominal Tagihan
            ctx.fillStyle = '#2563eb';
            ctx.font = 'bold 34px Poppins, sans-serif';
            ctx.fillText(formatRupiah(currentRawValue), 300, 165);

            // Bingkai QR
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(100, 200, 400, 400, 24);
            ctx.stroke();

            // Gambar QR Code di tengah
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(sourceElement, 125, 225, 350, 350);

            // Watermark Footer QRIS
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 20px Poppins, sans-serif';
            ctx.fillText('SATU QRIS UNTUK SEMUA', 300, 665);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '400 16px Poppins, sans-serif';
            ctx.fillText('QRIS Dinamis • Siap Dipindai', 300, 698);

            const fileName = `QRIS-ArifDharma-${currentRawValue}.png`;

            // Gunakan toBlob dengan fallback toDataURL untuk kompatibilitas penuh di Android/iOS/Desktop
            if (exportCanvas.toBlob) {
                exportCanvas.toBlob((blob) => {
                    if (!blob) return;
                    const blobUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
                    showToast('QRIS berhasil disimpan!');
                }, 'image/png');
            } else {
                const dataUrl = exportCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('QRIS berhasil disimpan!');
            }
        } catch (err) {
            console.error('Gagal menyimpan gambar:', err);
            showError('Gagal menyimpan gambar QRIS.');
        }
    });

    // Sudah Dibayar (Tampilkan Animasi Sukses)
    paidBtn.addEventListener('click', () => {
        successOverlay.classList.remove('hidden');
        successOverlay.classList.add('flex');
        void successOverlay.offsetWidth;
        successOverlay.style.opacity = '1';

        setTimeout(() => {
            resetApp();
        }, 2600);
    });

</script>
</body>
</html>
